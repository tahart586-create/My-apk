name: Compile Godot APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Export APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export Game
        uses: firebelley/godot-export@v5.2.0
        with:
          godot: 4.3
          # إذا كان اسم ملف المشروع الخاص بك مختلفاً، ضعه هنا (مثلاً project.godot)
          # project: project.godot

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: /root/.local/share/godot/export/Android/app.apk
