name: Compile Godot APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Export APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # تحديد إصدار محرك غودوت (تأكد من مطاقته للإصدار الذي صنعت به مشروعك، مثل 4.2 أو 4.3)
      - name: Setup Godot Engine
        uses: abarrak/godot-action@v2
        with:
          version: 4.3-stable
          use-dotnet: false

      - name: Setup Android SDK and Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/godot/
          # تحميل قوالب التصدير الخاصة بأندرويد تلقائياً بناءً على إصدار غودوت

      - name: Create Build Directory
        run: mkdir -p build

      - name: Export to Android APK
        run: |
          godot --headless --export-release "Android" build/app.apk
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/app.apk
