name: Build APK

on:
  workflow_dispatch:
  push:

env:
  GODOT_VERSION: 4.3

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot Export Templates
        run: |
          # إنشاء المجلدات المطلوبة في مسار المستخدم الجذر (Root) لأن الحاوية تعمل بصلاحيات Root
          mkdir -p /root/.local/share/godot/export_templates/
          mkdir -p /root/.config/godot/

          # التأكد من نسخ القوالب من مسار الحاوية الافتراضي إذا لزم الأمر
          if [ -d "/root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable" ]; then
            echo "Export templates already exist."
          else
            echo "Templates path check..."
          fi

      - name: Verify Java and Android SDK
        run: |
          java -version
          echo "Android SDK Root: $ANDROID_SDK_ROOT"

      - name: Import Project
        run: |
          godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          # تأكد من أن اسم الـ Preset في ملف export_presets.cfg مطابقة تماماً لكلمة "Android"
          godot --headless --path . --export-debug "Android" build/feast_serving.apk
          test -s build/feast_serving.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Feast-Serving-APK
          path: build/feast_serving.apk
